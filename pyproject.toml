[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "season-to-screen"
version = "0.1.0"
description = "Condense a TV season into a movie with a resumable NLP pipeline."
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
sts = "sts.app.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["sts*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: opt-in smoke test using FFmpeg and a real Whisper model"]
