[theme]
base = "dark"
primaryColor = "#d8af72"
backgroundColor = "#0b0f16"
secondaryBackgroundColor = "#131b26"
textColor = "#f2f0eb"
font = "sans serif"

[server]
address = "127.0.0.1"
headless = true
maxUploadSize = 2048
# Model libraries expose lazy optional modules; inspecting them on every rerun
# imports unrelated vision backends. Reload the page/server after code changes.
fileWatcherType = "none"

[browser]
gatherUsageStats = false
